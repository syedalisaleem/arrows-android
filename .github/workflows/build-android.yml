name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p Keys
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > Keys/arrows-release.keystore
          ls -l Keys/arrows-release.keystore

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.58f2
          androidExportType: androidAppBundle
          androidKeystoreName: Keys/arrows-release.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: arrows
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          buildName: Arrows
          versionCode: ${{ github.run_number }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Arrows-${{ github.run_number }}.aab
          path: build/Android/*.aab
          if-no-files-found: error
