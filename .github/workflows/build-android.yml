name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json') }}-${{ github.run_number }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/packages-lock.json') }}-
            Library-Android-
            Library-

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p Keys
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > Keys/arrows-release.keystore
          ls -l Keys/arrows-release.keystore

      - name: Verify Unity licence is present
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE secret is not set."
            echo "::error::A Unity Personal licence can only be issued by Unity Hub."
            echo "::error::See README for the one-time steps."
            exit 1
          fi
          echo "UNITY_LICENSE is set ($(echo -n "$UNITY_LICENSE" | wc -c) bytes)."

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          # Unity Personal activation goes through the serial, not the .ulf file.
          # A Personal serial starts with F; the container randomises /etc/machine-id
          # for those so activation is not tied to the machine that issued the licence.
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.58f2
          androidExportType: androidAppBundle
          androidKeystoreName: Keys/arrows-release.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: arrows
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          buildName: Arrows
          # Play requires a versionCode that increases on every upload.
          # github.run_number does exactly that and is unique per build.
          versioning: Custom
          version: 1.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          # Keys/ is gitignored, but this keeps the build resilient if anything
          # else in the workspace ends up untracked.
          allowDirtyBuild: true

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Arrows-AAB-${{ github.run_number }}
          path: build/Android/*.aab
          if-no-files-found: error

      # Play only accepts an .aab, but a phone can only sideload an .apk. Rather than
      # running Unity twice, fold the bundle into a universal APK signed with the same
      # upload key. The APK is a testing convenience, never the store artifact.
      - name: Build universal APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION=1.18.3
          curl -sSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"

          AAB=$(ls build/Android/*.aab | head -n 1)
          echo "Converting $AAB"

          java -jar bundletool.jar build-apks \
            --bundle="$AAB" \
            --output=Arrows.apks \
            --mode=universal \
            --ks=Keys/arrows-release.keystore \
            --ks-key-alias=arrows \
            --ks-pass="pass:${ANDROID_KEYSTORE_PASS}" \
            --key-pass="pass:${ANDROID_KEYSTORE_PASS}"

          unzip -oq Arrows.apks universal.apk
          mv universal.apk Arrows.apk
          ls -lh Arrows.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arrows-APK-${{ github.run_number }}
          path: Arrows.apk
          if-no-files-found: error
