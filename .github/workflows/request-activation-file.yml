name: Request activation file

# Generates the Unity .alf activation request INSIDE the GameCI editor image.
#
# Why inside: GameCI's base image pins /etc/machine-id to a fixed value
# (576562626572264761624c65526f7578) so the container always presents the same
# machine identity. A .ulf activated from an .alf generated here therefore stays
# valid for every future build.
#
# The .alf is then activated at https://license.unity3d.com/manual to get a .ulf.

on:
  workflow_dispatch:

jobs:
  alf:
    name: Generate .alf
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activation file in the editor image
        run: |
          mkdir -p out
          docker run --rm \
            -v "$PWD/out:/out" \
            unityci/editor:ubuntu-6000.0.58f2-android-3.2.2 \
            bash -c 'cd /out
              echo "=== machine identity the licence will bind to ==="
              cat /etc/machine-id
              echo "=== requesting activation file ==="
              unity-editor -nographics -createManualActivationFile -logFile /dev/stdout 2>&1 | tail -40
              echo "=== resulting files ==="
              ls -la /out'

      - name: Show what we got
        if: always()
        run: |
          echo "--- artifacts ---"
          ls -la out/ || true
          for f in out/*.alf; do
            [ -e "$f" ] || continue
            echo "--- size of $f ---"
            wc -c "$f"
            echo "--- first 400 bytes ---"
            head -c 400 "$f"
            echo
          done

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-file
          path: out/**
          if-no-files-found: warn
