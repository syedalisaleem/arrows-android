name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json') }}-${{ github.run_number }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/packages-lock.json') }}-
            Library-Android-
            Library-

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p Keys
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > Keys/arrows-release.keystore
          ls -l Keys/arrows-release.keystore

      - name: Verify Unity licence is present
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE secret is not set."
            echo "::error::A Unity Personal licence can only be issued by Unity Hub."
            echo "::error::See README for the one-time steps."
            exit 1
          fi
          echo "UNITY_LICENSE is set ($(echo -n "$UNITY_LICENSE" | wc -c) bytes)."

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 6000.0.58f2
          androidExportType: androidAppBundle
          androidKeystoreName: Keys/arrows-release.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: arrows
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          buildName: Arrows
          # Play requires a versionCode that increases on every upload.
          # github.run_number does exactly that and is unique per build.
          versioning: Custom
          version: 1.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          # Keys/ is gitignored, but this keeps the build resilient if anything
          # else in the workspace ends up untracked.
          allowDirtyBuild: true

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Arrows-AAB-${{ github.run_number }}
          path: build/Android/*.aab
          if-no-files-found: error
