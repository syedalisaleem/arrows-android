name: Licence probe

# Diagnostic only. Answers one question: now that the Unity account holds a real
# Personal entitlement, can the editor image obtain a licence from credentials?
#
# Manual trigger only - this must never run on push.

on:
  workflow_dispatch:

jobs:
  probe:
    name: Can the container get a licence?
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run probe inside the editor image
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p out
          chmod +x .github/probe-licence.sh
          docker run --rm \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            -v "$PWD/.github/probe-licence.sh:/probe.sh:ro" \
            -v "$PWD/out:/out" \
            unityci/editor:ubuntu-6000.0.58f2-android-3.2.2 \
            bash /probe.sh

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licence-probe
          path: out/**
          if-no-files-found: warn
